# Flatpak manifest for ready2rip (GitHub Release .flatpak bundles).
# Build from repo root:
#   flatpak-builder --user --force-clean --repo=flatpak-repo \
#     build-flatpak flatpak/org.ready2rip.Ready2Rip.yml
#   flatpak build-bundle flatpak-repo dist/ready2rip-VERSION-ARCH.flatpak \
#     org.ready2rip.Ready2Rip

id: org.ready2rip.Ready2Rip
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: ready2rip
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-music
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.UDisks2
# GNOME 49 / Freedesktop 25.08 ships ffmpeg via the codecs-extra extension
# (auto-installed with the runtime). Do not declare ffmpeg-full.
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'
modules:
  - name: libcdio
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-example-progs
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/libcdio/libcdio-2.1.0.tar.bz2
        sha256: 8550e9589dbd594bfac93b81ecf129b1dc9d0d51e90f9696f1b2f9b2af32712b

  - name: libcdio-paranoia
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-example-progs
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/libcdio/libcdio-paranoia-10.2+2.0.2.tar.bz2
        sha256: 186892539dedd661276014d71318c8c8f97ecb1250a86625256abd4defbf0d0c

  - name: flac
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-examples
      - --disable-thorough-tests
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/xiph/releases/flac/flac-1.4.3.tar.xz
        sha256: 6c58e69cd22348f441b861092b825e591d0b822e106de6eb0ee4d05d27205b70

  - name: lame
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-gtktest
    # Modern ncurses splits termcap helpers into libtinfo.
    build-options:
      ldflags: -ltinfo
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
        sha256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e

  # Network pip is fine for GitHub Release bundles (not a Flathub submission).
  # Pillow's sdist needs pybind11 / build isolation that offline installs miss.
  - name: python3-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --verbose --prefix=${FLATPAK_DEST}
        'mutagen==1.48.1' 'Pillow==13.0.0'
    sources:
      - type: file
        path: org.ready2rip.Ready2Rip.yml

  - name: ready2rip
    buildsystem: meson
    config-opts:
      - --prefix=/app
    sources:
      - type: dir
        path: ..
