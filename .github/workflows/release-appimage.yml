# Build portable AppImages (x86_64 + aarch64) on Ubuntu 26.04 and attach
# them to the GitHub Release for the matching tag.
#
# Usage:
#   1. Bump version in meson.build (and friends) on main.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow builds and uploads:
#        ready2rip-VERSION-x86_64.AppImage (+ .zsync)
#        ready2rip-VERSION-aarch64.AppImage (+ .zsync)
#
# Manual dry-run (artifact only unless publish_release is on):
#   Actions → Release AppImage → Run workflow
# Nightly builds upload artifacts only (no release publish).

name: Release AppImage

on:
  push:
    tags: ['v*']
  schedule:
    # Daily 06:00 UTC — AppImage artifact smoke; does not publish a release.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Upload AppImage to the GitHub Release for this meson version'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm

    name: AppImage ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Prefer pip Meson so we stay on >=1.0 even if apt lags.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            binutils \
            ninja-build \
            python3 \
            python3-pip \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgtk-4-1 \
            libadwaita-1-0 \
            gobject-introspection \
            libgirepository1.0-dev \
            cdparanoia \
            flac \
            lame \
            ffmpeg \
            opus-tools \
            zsync \
            ca-certificates \
            gir1.2-girepository-2.0 \
            libfuse2 \
            desktop-file-utils
          python3 -m pip install --user 'meson>=1.3,<2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify encoder / extract tools on PATH
        run: |
          set -euo pipefail
          echo "runner arch=$(uname -m) expected=${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          for t in python3 meson ninja gcc curl cdparanoia flac lame ffmpeg opusenc zsyncmake; do
            command -v "$t"
          done
          meson --version

      - name: Check tag matches meson version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(grep -E "version: '" meson.build | head -1 | sed -E "s/.*version: '([^']+)'.*/\1/")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "meson version=${VERSION} tag=${TAG}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "error: meson.build version (${VERSION}) must match tag (${TAG})" >&2
            exit 1
          fi

      - name: Build AppImage
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./appimage/build-appimage.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ready2rip-appimage-${{ matrix.arch }}
          path: |
            dist/ready2rip-*-${{ matrix.arch }}.AppImage
            dist/ready2rip-*-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          arch="${{ matrix.arch }}"
          assets=(dist/ready2rip-*-"${arch}".AppImage dist/ready2rip-*-"${arch}".AppImage.zsync)
          if [ "${#assets[@]}" -lt 1 ]; then
            echo "error: no AppImage assets in dist/ for ${arch}" >&2
            exit 1
          fi
          VERSION="$(grep -E "version: '" meson.build | head -1 | sed -E "s/.*version: '([^']+)'.*/\1/")"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${VERSION}"
          fi
          title="ready2rip ${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            # First arch to finish creates the release; the other uploads with --clobber.
            gh release create "$tag" "${assets[@]}" \
              --title "$title" \
              --generate-notes \
              --target "${GITHUB_SHA}" \
              || gh release upload "$tag" "${assets[@]}" --clobber
          fi
          gh release view "$tag"
