# Build portable AppImages (x86_64 + aarch64) on Ubuntu 22.04 (glibc 2.35),
# GPG-sign them, and attach to the GitHub Release for the matching tag.
#
# Why 22.04: AppImageHub’s catalog tester still runs on the oldest Ubuntu LTS
# in standard support (currently 22.04). Building on newer runners (24.04/26.04)
# produces binaries that need GLIBC_2.36+ and fail that check.
#
# Modern GTK 4 / libadwaita are built into a cached GNOME_PREFIX via
# appimage/build-gnome-prefix.sh (jammy’s packages are too old for Adw.Dialog).
# Python 3.11 comes from deadsnakes (jammy’s system Python is 3.10).
#
# Secrets (required for signed publish builds):
#   APPIMAGE_GPG_PRIVATE_KEY  — armored private key
#   APPIMAGE_GPG_PASSPHRASE   — key passphrase
#   APPIMAGE_GPG_KEY_ID       — fingerprint / key id
#
# Public key for verification: packaging/ready2rip-signing-key.asc
#
# Usage:
#   1. Bump version in meson.build (and friends) on main.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. Uploads:
#        ready2rip-VERSION-x86_64.AppImage (+ .zsync)
#        ready2rip-VERSION-aarch64.AppImage (+ .zsync)
#
# Manual dry-run (artifact only unless publish_release is on):
#   Actions → Release AppImage → Run workflow
# Nightly builds upload artifacts only (still signed when secrets exist).

name: Release AppImage

on:
  push:
    tags: ['v*']
  schedule:
    # Daily 06:00 UTC — AppImage artifact smoke; does not publish a release.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Upload AppImage to the GitHub Release for this meson version'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    name: AppImage ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    env:
      GNOME_PREFIX: ${{ github.workspace }}/build-appimage/gnome-prefix
      PYTHON: python3.11

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            binutils \
            ninja-build \
            pkg-config \
            gettext \
            flex \
            bison \
            xz-utils \
            git \
            software-properties-common \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            ca-certificates \
            libfuse2 \
            desktop-file-utils \
            gnupg \
            zsync \
            cdparanoia \
            flac \
            lame \
            ffmpeg \
            opus-tools \
            libffi-dev \
            libpcre2-dev \
            zlib1g-dev \
            libmount-dev \
            libselinux1-dev \
            libsystemd-dev \
            libxml2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libwebp-dev \
            shared-mime-info \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxinerama-dev \
            libxfixes-dev \
            libgraphene-1.0-dev \
            libepoxy-dev \
            libdrm-dev \
            libgbm-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf2.0-dev \
            libappstream-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            sassc \
            cmake
          # Python 3.11 (jammy system Python is 3.10; project requires >=3.11).
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3.11 \
            python3.11-dev \
            python3.11-venv \
            python3.11-distutils
          curl -sS https://bootstrap.pypa.io/get-pip.py | sudo python3.11
          # PyGObject ≥3.52 needs girepository-2.0 (noble+). Stay on 3.4x for jammy.
          sudo python3.11 -m pip install --upgrade \
            'meson>=1.3,<2' \
            'pycairo>=1.20' \
            'PyGObject>=3.42,<3.52'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify encoder / extract tools on PATH
        run: |
          set -euo pipefail
          echo "runner arch=$(uname -m) expected=${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          for t in python3.11 meson ninja gcc curl cdparanoia flac lame ffmpeg opusenc zsyncmake gpg; do
            command -v "$t"
          done
          python3.11 --version
          meson --version
          ldd --version | head -1

      - name: Cache GNOME prefix (GLib / GTK / libadwaita)
        uses: actions/cache@v4
        with:
          path: |
            build-appimage/gnome-prefix
            build-appimage/gnome-src
          key: gnome-prefix-22.04-${{ matrix.arch }}-glib2.78.6-gtk4.14.5-adw1.5.3
          restore-keys: |
            gnome-prefix-22.04-${{ matrix.arch }}-

      - name: Build GNOME prefix
        run: |
          set -euo pipefail
          chmod +x appimage/build-gnome-prefix.sh
          GNOME_SRC="${PWD}/build-appimage/gnome-src" \
            ./appimage/build-gnome-prefix.sh "$GNOME_PREFIX"

      - name: Check tag matches meson version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(grep -E "version: '" meson.build | head -1 | sed -E "s/.*version: '([^']+)'.*/\1/")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "meson version=${VERSION} tag=${TAG}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "error: meson.build version (${VERSION}) must match tag (${TAG})" >&2
            exit 1
          fi

      - name: Import AppImage signing key
        id: gpg
        env:
          APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
          APPIMAGE_GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
          APPIMAGE_GPG_KEY_ID: ${{ secrets.APPIMAGE_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPIMAGE_GPG_PRIVATE_KEY:-}" ] || [ -z "${APPIMAGE_GPG_KEY_ID:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "warning: AppImage GPG secrets not configured — building unsigned" >&2
            exit 0
          fi
          printf '%s\n' "$APPIMAGE_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "key_id=${APPIMAGE_GPG_KEY_ID}" >> "$GITHUB_OUTPUT"
          gpg --list-secret-keys --keyid-format LONG

      - name: Build AppImage
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SIGN: ${{ steps.gpg.outputs.signed == 'true' && '1' || '0' }}
          SIGN_KEY: ${{ steps.gpg.outputs.key_id }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
          APPIMAGETOOL_FORCE_SIGN: ${{ steps.gpg.outputs.signed == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          export PATH="${GNOME_PREFIX}/bin:${PATH}"
          export PKG_CONFIG_PATH="${GNOME_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="${GNOME_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export GI_TYPELIB_PATH="${GNOME_PREFIX}/lib/girepository-1.0:${GI_TYPELIB_PATH:-}"
          export XDG_DATA_DIRS="${GNOME_PREFIX}/share:${XDG_DATA_DIRS:-/usr/share}"
          ./appimage/build-appimage.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ready2rip-appimage-${{ matrix.arch }}
          path: |
            dist/ready2rip-*-${{ matrix.arch }}.AppImage
            dist/ready2rip-*-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          arch="${{ matrix.arch }}"
          assets=(dist/ready2rip-*-"${arch}".AppImage dist/ready2rip-*-"${arch}".AppImage.zsync)
          if [ "${#assets[@]}" -lt 1 ]; then
            echo "error: no AppImage assets in dist/ for ${arch}" >&2
            exit 1
          fi
          VERSION="$(grep -E "version: '" meson.build | head -1 | sed -E "s/.*version: '([^']+)'.*/\1/")"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${VERSION}"
          fi
          title="ready2rip ${tag#v}"
          notes_file="$(mktemp)"
          python3 .github/scripts/release-notes-from-metainfo.py >"$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$title" \
              --notes-file "$notes_file" \
              --target "${GITHUB_SHA}" \
              || gh release upload "$tag" "${assets[@]}" --clobber
          fi
          rm -f "$notes_file"
          gh release view "$tag"
