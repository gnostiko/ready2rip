name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Ruff
        run: ruff check src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

  package:
    name: Meson install + metadata validate
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            libglib2.0-bin \
            libglib2.0-dev \
            appstream \
            desktop-file-utils \
            gettext
          python3 -m pip install --user 'meson>=1.3,<2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Meson setup / compile / install
        run: |
          set -euo pipefail
          meson --version
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR="${PWD}/install-root" meson install -C build
          test -x install-root/usr/bin/ready2rip
          test -f install-root/usr/share/glib-2.0/schemas/org.ready2rip.Ready2Rip.gschema.xml
          test -f install-root/usr/share/applications/org.ready2rip.Ready2Rip.desktop
          test -f install-root/usr/share/metainfo/org.ready2rip.Ready2Rip.metainfo.xml

      - name: Validate GSettings schema
        run: |
          set -euo pipefail
          glib-compile-schemas --strict --dry-run data/
          meson test -C build --print-errorlogs

      - name: Validate desktop file
        run: |
          set -euo pipefail
          desktop-file-validate build/data/org.ready2rip.Ready2Rip.desktop
          desktop-file-validate \
            install-root/usr/share/applications/org.ready2rip.Ready2Rip.desktop

      - name: Validate AppStream metainfo
        run: |
          set -euo pipefail
          appstreamcli validate --no-net \
            build/data/org.ready2rip.Ready2Rip.metainfo.xml
          appstreamcli validate --no-net \
            install-root/usr/share/metainfo/org.ready2rip.Ready2Rip.metainfo.xml
